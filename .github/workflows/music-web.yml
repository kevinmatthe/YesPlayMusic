name: Music Web
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: music-web-dist
          path: dist
          if-no-files-found: error
