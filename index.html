<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f2">
  <meta name="color-scheme" content="light dark">
  <script id="theme-bootstrap">
    (function () {
      var mode = 'system', dark = false;
      try {
        var saved = window.localStorage.getItem('betago:theme-mode');
        if (saved === 'light' || saved === 'dark') mode = saved;
      } catch (_) {}
      try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (_) {}
      var theme = mode === 'system' ? (dark ? 'dark' : 'light') : mode;
      var root = document.documentElement;
      root.dataset.theme = theme;
      root.dataset.themeMode = mode;
      root.style.colorScheme = theme;
      var color = theme === 'dark' ? '#111c17' : '#f7f8f2';
      root.style.backgroundColor = color;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', color);
      document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme);
    })();
  </script>
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="BetaGo Music，你的音乐，你的空间。">
  <title>BetaGo Music</title>
  <link rel="icon" type="image/svg+xml" href="/music-cover.svg">
</head>
<body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
